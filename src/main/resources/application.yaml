server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: NotificationService

  # env 파일 내의 환경변수를 불러오는 설정 (확장자가 없으므로 properties 형식으로 강제 파싱)
  config:
    import: optional:file:.env[.properties]

  # 데이터베이스(MySQL) 연결 설정 (notification_db)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA(Hibernate) 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Firebase FCM 설정 연동 (커스텀 속성)
firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH}

# 마이크로서비스 내부 통신 시크릿 키 (X-Internal-Secret 헤더 검증용)
internal:
  secret-key: ${INTERNAL_SECRET_KEY}

# JWT 토큰 검증 설정 (Access Token 유효성 검사에 사용)
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}

# 타 마이크로서비스 내부 통신 URL 설정
services:
  device-url: ${SERVICES_DEVICE_URL:http://localhost:8082}
  admin-url: ${SERVICES_ADMIN_URL:http://localhost:8084}

# Swagger / SpringDoc 설정
springdoc:
  api-docs:
    path: /api/notifications/v3/api-docs
  swagger-ui:
    path: /api/notifications/swagger-ui.html
